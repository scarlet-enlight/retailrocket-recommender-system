[project]
name = "data-pipeline"
version = "0.1.0"
description = "Data Engineering pipeline for Retailrocket e-commerce dataset"
readme = "README.md"
authors = [
    { name = "LonelyLake", email = "starlitskycode@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.1.1",
]

[project.scripts]
data-pipeline = "data_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]